<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Clue Companion</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --accent: #ff5722;
            --text: #ffffff;
            --muted: #b3b3b3;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: var(--card);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 { margin: 0 0 20px 0; font-size: 24px; color: var(--accent); }
        .mode-btn {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .mode-btn:active { background: #3a3a3a; }
        .action-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        .action-btn:active { background-color: #e64a19; }
        .hidden { display: none; }
        
        .prompt-box {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            line-height: 1.4;
            min-height: 60px;
            color: var(--muted);
        }
        
        /* Adjusted Answer Box to accommodate TH translations */
        .answer-box {
            background: #252525;
            padding: 25px 10px;
            border-radius: 8px;
            border: 2px dashed var(--accent);
            font-size: 36px; /* Scaled down from 48px */
            font-weight: 900;
            color: #ffeb3b;
            margin: 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
            word-wrap: break-word;
        }
        
        .timer-text {
            font-size: 42px;
            font-weight: bold;
            font-family: monospace;
            margin: 15px 0;
            color: #4caf50;
        }
        .timer-text.warning {
			color: #f44336;
		}
		.version-footer {
            margin-top: 25px;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.5px;
            opacity: 0.6;
        }
		
    </style>
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Game%20Clues%22,%22short_name%22:%22Clues%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23121212%22,%22theme_color%22:%22%23ff5722%22}">
</head>
<body>

    <!-- SCREEN 1: MODE SELECT -->
    <div id="screen-modes" class="card">
        <h1>Select Game Mode</h1>
        <button class="mode-btn" onclick="pickMode('words_normal')">🔤 Words (Normal)</button>
        <button class="mode-btn" onclick="pickMode('words_extreme')">🔥 Words (Extreme)</button>
        <button class="mode-btn" onclick="pickMode('persons')">👤 Known Persons</button>
		<button class="mode-btn" onclick="pickMode('fic_char')">🎅 Fictional Characters</button>
        <button class="mode-btn" onclick="pickMode('facts')">💡 Fun Facts (EN)</button>
        <button class="mode-btn" onclick="pickMode('facts_th')">🇹🇭 Fun Facts (TH)</button>
        <button class="mode-btn" onclick="pickMode('other')">🌀 Other / Custom</button>
        
        <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
        <button class="mode-btn" style="background: #1565c0; border-color: #1e88e5;" onclick="exportMarkdown()">📋 View Database Markdown</button>
		
		<div class="version-footer">Loading versions...</div>
    </div>

    <!-- SCREEN 2: GAME BOARD -->
    <div id="screen-game" class="card hidden">
        <h1 id="game-title">Mode</h1>
        
        <!-- Prompt/Question Display -->
        <div id="prompt-display" class="prompt-box">Clue prompt goes here...</div>
        
        <!-- Hidden Answer Block -->
        <button id="btn-reveal" class="action-btn" style="background:#333; padding: 20px; font-size: 20px;" onclick="toggleAnswer()">👁️ Show Answer</button>
        <div id="answer-display" class="answer-box hidden">ANSWER</div>
        
        <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
        
        <!-- Timer Block -->
        <div style="display: flex; justify-content: center; align-items: center; gap: 15px;">
            <button onclick="adjustTimer(-30)" style="background:#444; color:white; border:none; padding:10px 20px; border-radius:8px; font-size:24px; font-weight:bold; cursor:pointer;">-</button>
            <div id="timer-display" class="timer-text">03:00</div>
            <button onclick="adjustTimer(30)" style="background:#444; color:white; border:none; padding:10px 20px; border-radius:8px; font-size:24px; font-weight:bold; cursor:pointer;">+</button>
        </div>
        <button id="btn-timer" class="action-btn" style="background:#2e7d32;" onclick="toggleTimer()">⏱️ Start Timer</button>
        
        <!-- Navigation -->
        <button class="action-btn" style="background:#555; margin-top:25px;" onclick="nextCard()">Next Card ➡️</button>
        <button class="action-btn" style="background:#222;" onclick="goHome()">🏠 Change Mode</button>
    </div>
	
	<!-- Load the database -->
	<script src="decks.js"></script>

	<script>
        // Define your main app version here
        const appVersion = "v1.5";

        // Function to update the version footers automatically
        function updateVersionFooters() {
            const footers = document.querySelectorAll('.version-footer');
            footers.forEach(footer => {
                footer.textContent = `app ${appVersion} / decks ${decksVersion}`;
            });
        }

        // Call it immediately when the script runs, or inside window.onload
        updateVersionFooters();


        // --- GAME STATES ---
        let currentMode = '';
        let currentDeck = [];
        let currentCardIndex = 0;
        
        let timerDuration = 180; 
        let timerInterval = null;
        let timeRemaining = timerDuration;

        function pickMode(mode) {
            currentMode = mode;
            currentDeck = [...decks[mode]].sort(() => Math.random() - 0.5); 
            currentCardIndex = 0;
            
            document.getElementById('game-title').innerText = mode.replace('_', ' ').toUpperCase();
            showScreen('screen-game');
            loadCard();
        }

        function loadCard() {
            resetTimer();
            hideAnswerState();
            
            if(currentDeck.length === 0) {
                document.getElementById('prompt-display').innerHTML = "Out of cards! Reshuffling...";
                document.getElementById('answer-display').innerHTML = "N/A";
                return;
            }

            let card = currentDeck[currentCardIndex];
            
            let promptHTML = card.q;
            if (card.q_th) promptHTML += `<br><span style="font-size: 0.85em; color: #888; font-weight: normal; margin-top: 5px; display: inline-block;">${card.q_th}</span>`;
            document.getElementById('prompt-display').innerHTML = promptHTML;

            let answerHTML = card.a;
            if (card.a_th) answerHTML += `<br><span style="font-size: 0.65em; color: #ffca28; margin-top: 10px; display: block; font-weight: bold; letter-spacing: 0px;">${card.a_th}</span>`;
            document.getElementById('answer-display').innerHTML = answerHTML;
        }

        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % currentDeck.length;
            loadCard();
        }

        function toggleAnswer() {
            const display = document.getElementById('answer-display');
            const btn = document.getElementById('btn-reveal');
            if(display.classList.contains('hidden')) {
                display.classList.remove('hidden');
                btn.innerText = "🙈 Hide Answer";
            } else {
                hideAnswerState();
            }
        }

        function hideAnswerState() {
            document.getElementById('answer-display').classList.add('hidden');
            document.getElementById('btn-reveal').innerText = "👁️ Show Answer";
        }

        // --- TIMER LOGIC ---
        function adjustTimer(seconds) {
            timerDuration += seconds;
            if (timerDuration < 30) {
                timerDuration = 30;
            }
            if (!timerInterval) {
                timeRemaining = timerDuration;
                updateTimerUI();
            }
        }

        function toggleTimer() {
            const btn = document.getElementById('btn-timer');
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                btn.innerText = "⏱️ Resume Timer";
                btn.style.background = "#2e7d32";
            } else {
                btn.innerText = "⏸️ Pause Timer";
                btn.style.background = "#c62828";
                timerInterval = setInterval(() => {
                    timeRemaining--;
                    updateTimerUI();
                    if(timeRemaining <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        document.getElementById('timer-display').innerText = "TIME'S UP!";
                        btn.innerText = "⏱️ Restart Timer";
                        btn.style.background = "#2e7d32";
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            timeRemaining = timerDuration;
            updateTimerUI();
            const btn = document.getElementById('btn-timer');
            btn.innerText = "⏱️ Start Timer";
            btn.style.background = "#2e7d32";
        }

        function updateTimerUI() {
            const minutes = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            const seconds = (timeRemaining % 60).toString().padStart(2, '0');
            const el = document.getElementById('timer-display');
            el.innerText = `${minutes}:${seconds}`;
            
            if(timeRemaining <= 30) {
                el.classList.add('warning');
            } else {
                el.classList.remove('warning');
            }
        }

        function goHome() {
            clearInterval(timerInterval);
            timerInterval = null;
            showScreen('screen-modes');
        }

        function showScreen(id) {
            document.getElementById('screen-modes').classList.add('hidden');
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        // --- MARKDOWN EXPORT LOGIC ---
        function exportMarkdown() {
            let mdText = "# Game Companion Database Export\n\n";
            
            for (const [deckName, cards] of Object.entries(decks)) {
                const formattedTitle = deckName.replace('_', ' ').toUpperCase();
                mdText += `## ${formattedTitle} (${cards.length} items)\n\n`;
                mdText += "| Prompt / Question | Hidden Answer |\n";
                mdText += "| --- | --- |\n";
                
                cards.forEach(card => {
                    const fullQ = card.q + (card.q_th ? ` / ${card.q_th}` : '');
                    const fullA = card.a + (card.a_th ? ` / ${card.a_th}` : '');
                    
                    const safeQ = fullQ.replace(/\|/g, '\\|').replace(/\n/g, ' ');
                    const safeA = fullA.replace(/\|/g, '\\|').replace(/\n/g, ' ');
                    mdText += `| ${safeQ} | **${safeA}** |\n`;
                });
                
                mdText += "\n---\n\n";
            }

            const newWindow = window.open();
            if (newWindow) {
                newWindow.document.write(`
                    <html>
                    <head>
                        <title>Database Markdown Source</title>
                        <style>
                            body { background: #121212; color: #e0e0e0; font-family: monospace; padding: 20px; line-height: 1.5; }
                            pre { white-space: pre-wrap; word-wrap: break-word; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
                            button { padding: 10px 15px; font-weight: bold; background: #ff5722; color: white; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 15px; }
                            button:active { background: #e64a19; }
                        </style>
                    </head>
                    <body>
                        <button onclick="navigator.clipboard.writeText(document.getElementById('md-content').innerText); this.innerText='📋 Copied!'; setTimeout(() => this.innerText='📋 Copy to Clipboard', 2000)">📋 Copy to Clipboard</button>
                        <pre id="md-content">${mdText.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre>
                    </body>
                    </html>
                `);
                newWindow.document.close();
            } else {
                alert("Popup blocked! Please allow popups for this app to open data tables in a new browser tab.");
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('data:application/javascript,self.addEventListener(%22fetch%22,function(e){})');
            });
        }
    </script>
	
	
</body>
</html>
